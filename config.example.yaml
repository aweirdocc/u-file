# u-file 配置示例。复制为 config.yaml 后按需启用。
# 注意：
#   - 源定义持久化于 data/sources.json，凭据 AES-256-GCM 加密（主密钥 data/master.key，首次启动自动生成，请备份）；
#   - config.yaml 仅在 sources.json 不存在时作为初始导入（播种），之后以页面/API 管理为准；
#   - 数据目录可用 -data 参数指定（默认 ./data），含 users.json / audit.log / index.json。
server:
  port: 8080

sources:
  # 本地磁盘（开箱即用）
  - id: local-demo
    name: 本地示例
    type: local
    config:
      root: ./data/files

  # —— MinIO（本地 Docker 联调，见 deploy/docker-compose.dev.yml）——
  # - id: minio-demo
  #   name: MinIO 本地
  #   type: s3
  #   config:
  #     endpoint: http://127.0.0.1:9000
  #     region: us-east-1
  #     bucket: demo
  #     access_key: minioadmin
  #     secret_key: minioadmin
  #     use_path_style: true

  # —— Cloudflare R2 ——
  # - id: r2-demo
  #   name: Cloudflare R2
  #   type: s3
  #   config:
  #     endpoint: https://<ACCOUNT_ID>.r2.cloudflarestorage.com
  #     region: auto
  #     bucket: <BUCKET>
  #     access_key: <ACCESS_KEY_ID>
  #     secret_key: <SECRET_ACCESS_KEY>
  #     use_path_style: false    # R2 两种寻址均可

  # —— 阿里云 OSS（S3 兼容端点）——
  # - id: oss-demo
  #   name: 阿里云 OSS
  #   type: s3
  #   config:
  #     endpoint: https://s3.oss-cn-hangzhou.aliyuncs.com
  #     region: cn-hangzhou
  #     bucket: <BUCKET>
  #     access_key: <AccessKeyId>
  #     secret_key: <AccessKeySecret>
  #     use_path_style: false    # OSS 推荐 virtual-hosted；桶名含下划线时改 true

  # —— 腾讯云 COS（S3 兼容端点；桶名格式 <BucketName-APPID>）——
  # - id: cos-demo
  #   name: 腾讯云 COS
  #   type: s3
  #   config:
  #     endpoint: https://cos.ap-guangzhou.myqcloud.com
  #     region: ap-guangzhou
  #     bucket: <BUCKET-APPID>
  #     access_key: <SecretId>
  #     secret_key: <SecretKey>
  #     use_path_style: false    # 2024-01-01 后创建的桶不支持 path-style

  # —— FTP / FTPS（M2 起）——
  # - id: ftp-demo
  #   name: 老系统 FTP
  #   type: ftp
  #   config:
  #     host: 192.168.1.100
  #     port: 21                # 默认 21
  #     username: user
  #     password: pass
  #     tls: false              # true = FTPS（显式 AUTH TLS）
  #     insecure_tls: false     # 自签证书时跳过校验
  #     root: /srv/files        # 可选，默认根

  # —— SFTP（M2 起；password 与 private_key 二选一）——
  # - id: sftp-demo
  #   name: VPS SFTP
  #   type: sftp
  #   config:
  #     host: 203.0.113.10
  #     port: 22                # 默认 22
  #     username: root
  #     password: pass          # 方式一：密码
  #     # private_key: /home/me/.ssh/id_ed25519   # 方式二：私钥（PEM 文件路径或内容原文）
  #     # private_key_passphrase: xxx              # 私钥口令（无则省略）
  #     root: /var/www          # 可选，默认根

  # —— WebDAV（坚果云 / Nextcloud / 群晖 NAS / OpenList）——
  # - id: jianguoyun-demo
  #   name: 坚果云
  #   type: webdav
  #   config:
  #     endpoint: https://dav.jianguoyun.com/dav/我的坚果云   # 坚果云请勿直接挂载 /dav/ 根
  #     username: your_email@example.com
  #     password: <第三方应用专用密码>
  #     root: ""                # 可选子路径
  #     insecure_tls: false

  # —— Google Drive（个人盘 OAuth2 或 Service Account JSON）——
  # - id: gdrive-demo
  #   name: Google Drive
  #   type: gdrive
  #   config:
  #     auth_type: oauth2       # oauth2 或 service_account
  #     client_id: <GOOGLE_CLIENT_ID>
  #     client_secret: <GOOGLE_CLIENT_SECRET>
  #     refresh_token: <GOOGLE_REFRESH_TOKEN>
  #     # service_account_json: '{"type":"service_account",...}'
  #     root_folder_id: root    # 默认 root，可填指定文件夹 ID
  #     drive_id: ""            # 团队共享盘 Shared Drive ID（可选）
  #     proxy_url: http://127.0.0.1:7890   # 国内环境可选代理

  # —— 阿里云盘（官方 OpenAPI）——
  # - id: alipan-demo
  #   name: 阿里云盘
  #   type: alipan
  #   config:
  #     drive_type: backup      # backup（备份盘）或 resource（资源库）
  #     refresh_token: <ALIPAN_REFRESH_TOKEN>
  #     # 方式一：自建开放平台应用
  #     client_id: <APP_ID>
  #     client_secret: <APP_SECRET>
  #     # 方式二：三方 OAuth 令牌刷新代理（无 client_secret 时使用）
  #     # oauth_token_url: https://api.example.com/alist/ali_open/token
  #     root_folder_id: root
