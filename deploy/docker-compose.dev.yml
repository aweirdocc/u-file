# M0 联调环境：本地拉起 MinIO，作为 S3 协议族驱动的冒烟目标
# 用法：docker compose -f deploy/docker-compose.dev.yml up -d
# 控制台：http://127.0.0.1:9001 （minioadmin / minioadmin）
services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data

volumes:
  minio-data:
